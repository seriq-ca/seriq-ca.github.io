{%- assign t = site.data.i18n[page.lang] -%}
{%- if page.lang == "fr" -%}{%- assign home = "/" -%}
{%- else -%}{%- assign home = "/en/" -%}{%- endif -%}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ home | relative_url }}">
      <span class="brand-mark">SERIQ</span>
      <span class="brand-sub">{{ t.brand_sub }}</span>
    </a>
    <nav class="site-nav" aria-label="{{ t.nav.home }}">
      <a href="{{ home | relative_url }}" aria-current="page">{{ t.nav.home }}</a>
      {% include lang-toggle.html %}
    </nav>
  </div>
</header>
