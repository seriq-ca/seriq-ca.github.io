{%- assign schema_desc = page.description | default: site.description | strip_newlines -%}
{%- assign org_id = '/' | absolute_url | append: '#organization' -%}
{%- if page.event_start %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": {{ page.title | jsonify }},
  "startDate": "{{ page.event_start | date_to_xmlschema }}",
  "endDate": "{{ page.event_end | date_to_xmlschema }}",
  "eventStatus": "https://schema.org/EventScheduled",
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "location": {
    "@type": "Place",
    "name": {{ page.event_venue | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Montréal",
      "addressRegion": "QC",
      "addressCountry": "CA"
    }
  },
  "organizer": {
    "@type": "Organization",
    "@id": "{{ org_id }}",
    "name": {{ site.title | jsonify }},
    "url": "{{ '/' | absolute_url }}"
  },
{%- assign event_speakers = site.data.speakers[page.speakers] %}
{%- if event_speakers %}
  "performer": [
    {%- for s in event_speakers %}
    {
      "@type": "Person",
      "name": {{ s.name | jsonify }}
      {%- if s.url %},
      "url": {{ s.url | jsonify }}
      {%- endif %}
      {%- if s.affiliation %},
      "affiliation": { "@type": "Organization", "name": {{ s.affiliation | jsonify }} }
      {%- endif %}
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ],
{%- endif %}
  "image": "{{ page.image | default: '/assets/img/og.png' | absolute_url }}",
{%- if page.registration_url %}
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "CAD",
    "availability": "https://schema.org/InStock",
    "url": {{ page.registration_url | jsonify }}
    {%- if page.registration_opens %},
    "validFrom": "{{ page.registration_opens | date_to_xmlschema }}"
    {%- endif %}
    {%- if page.registration_closes %},
    "validThrough": "{{ page.registration_closes | date_to_xmlschema }}"
    {%- endif %}
  },
{%- endif %}
  "description": {{ schema_desc | jsonify }},
  "url": "{{ page.url | absolute_url }}"
}
</script>
{%- elsif page.ref == "home" or page.ref == "about" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ org_id }}",
  "name": {{ site.title | jsonify }},
  "alternateName": {{ site.description | strip_newlines | jsonify }},
  "url": "{{ '/' | absolute_url }}",
  "logo": "{{ '/assets/img/logo.png' | absolute_url }}",
  "image": "{{ '/assets/img/og.png' | absolute_url }}",
  "description": {{ schema_desc | jsonify }}
}
</script>
{%- endif -%}
