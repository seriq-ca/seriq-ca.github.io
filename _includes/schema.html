{%- assign schema_desc = page.description | default: site.description | strip_newlines -%}
{%- assign org_id = '/' | absolute_url | append: '#organization' -%}
{%- if page.event_start %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": {{ page.title | jsonify }},
  "startDate": "{{ page.event_start | date_to_xmlschema }}",
  "endDate": "{{ page.event_end | date_to_xmlschema }}",
  "eventStatus": "https://schema.org/EventScheduled",
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "location": {
    "@type": "Place",
    "name": {{ page.event_venue | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Montréal",
      "addressRegion": "QC",
      "addressCountry": "CA"
    }
  },
  "organizer": { "@id": "{{ org_id }}" },
  "description": {{ schema_desc | jsonify }},
  "url": "{{ page.url | absolute_url }}"
}
</script>
{%- elsif page.ref == "home" or page.ref == "about" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ org_id }}",
  "name": {{ site.title | jsonify }},
  "alternateName": {{ site.description | strip_newlines | jsonify }},
  "url": "{{ '/' | absolute_url }}",
  "description": {{ schema_desc | jsonify }}
}
</script>
{%- endif -%}
