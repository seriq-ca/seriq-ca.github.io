  affiliation: Université TÉLUQ
  url: https://lemire.me/en/
  # Hotlinked from the speaker's own site rather than self-hosted.
  photo: https://lemire.me/img/portrait2018.jpg
  # Expected to be the keynote, not yet confirmed.
  keynote: false
  title:
    fr: "Le logiciel libre comme méthode de recherche : de l'article scientifique à des milliards d'appareils"
    en: "Open source as a research method: from the scientific paper to billions of devices"
  abstract:
    fr: "Les bibliothèques libres comme simdjson et simdutf s’exécutent aujourd’hui dans Node.js, les navigateurs et les bases de données, au service de milliards de personnes chaque jour. Le modèle linéaire de l’innovation — le professeur publie, l’ingénieur lit, le client consomme — décrit rarement ce qui se passe vraiment. Comme le rappelait Michael Stonebraker, les idées naissent surtout du contact avec des utilisateurs réels et de leurs problèmes concrets. Le logiciel libre n’est pas seulement un moyen de diffuser des résultats : c’est une méthode de recherche à part entière. Il impose la reproductibilité, puisque le code et les bancs d’essai sont publics et vérifiables par quiconque. Les revues de code, les rapports de bogues et les demandes d’intégration forment une évaluation par les pairs souvent plus exigeante que bien des comités de lecture. Il fait aussi arriver les données du monde réel : cas adversariaux, architectures exotiques et charges de travail imprévues. L’histoire de simdjson inverse l’ordre attendu : d’abord le code, un billet de blogue, GitHub et quelques messages sur X, puis l’adoption industrielle, et seulement ensuite l’article scientifique. Le cycle se répète : l’usage révèle le goulot suivant, d’où l’algorithme Eisel-Lemire pour les flottants et simdutf pour l’UTF-8. Cette approche a toutefois ses tensions : la maintenance est ingrate et sans fin, et les incitatifs académiques comptent les articles, pas les contributions concrètes."
    en: "Open-source libraries such as simdjson and simdutf now run in Node.js, in browsers and in databases, serving billions of people every day. The linear model of innovation — the professor publishes, the engineer reads, the customer consumes — rarely describes what actually happens. As Michael Stonebraker pointed out, ideas come mostly from contact with real users and their concrete problems. Open source is not merely a way to disseminate results: it is a research method in its own right. It enforces reproducibility, since the code and the benchmarks are public and anyone can check them. Code reviews, bug reports and pull requests amount to a peer review that is often more demanding than many review committees. It also brings in real-world data: adversarial cases, exotic architectures and unforeseen workloads. The story of simdjson reverses the expected order: first the code, a blog post, GitHub and a few posts on X, then industrial adoption, and only then the scientific paper. The cycle repeats: use reveals the next bottleneck, hence the Eisel-Lemire algorithm for floating-point numbers and simdutf for UTF-8. The approach has its tensions, however: maintenance is thankless and never-ending, and academic incentives count papers, not concrete contributions."
  bio:
    fr: "Daniel Lemire est professeur d'informatique à l'Université du Québec (TELUQ). Ses travaux de
recherche et d'ingénierie portent sur le calcul haute performance, les structures de données
efficaces et l'optimisation de la performance logicielle. Il est l'auteur de bibliothèques libres
largement adoptées : on trouve ses algorithmes et son code dans plusieurs bibliothèques standards et systèmes majeurs, dont .NET, Rust, Go, Node.js, Google Chrome et Safari. Il figure parmi les 2 % de scientifiques les plus cités au monde selon le classement Université Stanford / Elsevier. Il est rédacteur de la revue Software: Practice and Experience (Wiley, fondée en 1971) et a reçu le Prix d'excellence en recherche 2020 de l'Université du Québec pour ses travaux sur l'accélération du traitement des documents JSON. Sur GitHub, il fait partie des 1000 développeurs les plus suivis parmi plus de 100 millions. Il est @lemire sur X et tient un blogue hebdomadaire à l'adresse https://lemire.me/."
    en: "Daniel Lemire is a professor of computer science at the Université du Québec (TÉLUQ). His research and engineering work covers high-performance computing, efficient data structures and software performance optimization. He is the author of widely adopted open-source libraries: his algorithms and his code are found in several standard libraries and major systems, including .NET, Rust, Go, Node.js, Google Chrome and Safari. He is among the top 2 % of most-cited scientists worldwide according to the Stanford University / Elsevier ranking. He is an editor of the journal Software: Practice and Experience (Wiley, founded in 1971) and received the Université du Québec's 2020 Research Excellence Award for his work on accelerating JSON document processing. On GitHub, he is among the 1000 most-followed developers out of more than 100 million. He is @lemire on X and writes a weekly blog at https://lemire.me/."

- name: Lionel Briand
  # Free text rather than a key into `institutions:` in _data/i18n/*.yml: that
  # table covers the four partner institutions, and speakers come from
  # elsewhere in Quebec, abroad and from industry. Add `fr:`/`en:` subkeys here
