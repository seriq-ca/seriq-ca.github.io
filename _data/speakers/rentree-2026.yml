  url: https://www.linkedin.com/in/yves-daoust-3aa594/
  # Cropped from Ferme d'Hiver's photo of its CTO and CEO, then self-hosted:
  # LinkedIn's image links are signed and expire.
  photo: daoust.jpg
  # Expected to be the keynote, not yet confirmed.
  keynote: false
  title:
    fr: "Des cartes perforées aux agents d'intelligence artificielle, comment l'organisation, les coûts et les modèles d'affaires des produits logiciels ont-ils évolué en 40 ans — et pourquoi ce moment est-il différent ?"
    en: "From punch cards to AI agents: How have the organization, costs, and business models of software products evolved over the past 40 years, and why is it different this time?"
  abstract:
    fr: "Cette conférence retrace le renversement historique des coûts matériel/main-d'œuvre, la transformation des équipes de développement et l'essor du web, de l'agilité et du cloud comme modèles d'affaires. Elle situe ensuite le tournant de l'assistance IA dans un mouvement plus large. Données à l'appui, elle distingue création de nouveaux produits et maintenance de code déjà maîtrisé, aborde les coûts d'opération des agents IA — sur le nuage comme en local — et conclut par l’émergence de marchés industriels longtemps trop complexes et trop pauvres, qui aujourd'hui se retrouvent en plein bouleversement."
    en: "This talk will retrace a historic shift in the balance between hardware and labor costs, the transformation of development teams, and the rise of the web, agility, and the cloud as business models. It will then place this shift toward AI-assisted support within a broader trend. Based on recent data, I will distinguish between the creation of new products and the maintenance of code that has already been mastered, discuss the operating costs of AI agents, both in the cloud and on-premises, and conclude by noting the emergence of industrial markets that were long considered too complex and underdeveloped, but are now undergoing a major transformation."
  bio:
    fr: "Yves Daoust est ingénieur et a fait carrière dans les télécommunications avant de se tourner vers l'agriculture. Il a fondé Ferme d'Hiver en 2018 et l'exploite depuis."
    en: "Yves Daoust is an engineer who worked in telecommunications before turning to agriculture. He founded Ferme d'Hiver in 2018 and has operated it since."
