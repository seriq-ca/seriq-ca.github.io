  affiliation: University of Ottawa
  url: https://www.lbriand.info/
  # Hotlinked from the speaker's own site rather than self-hosted.
  photo: https://conf.researchr.org/getProfileImage/lionelbriand/c9f095ec-44f6-413a-ac36-62c47cbaa92e/small?1783971207000
  # Expected to be the keynote, not yet confirmed.
  keynote: false
  title:
    fr: "L'IA perturbe votre stratégie de test logiciel, mais elle peut aussi y remédier"
    en: "AI Is Breaking Your Software Testing Strategy, and It Can Also Fix It"
  abstract:
    fr: |-
      Les entreprises se livrent à une course effrénée pour intégrer l'IA dans leurs produits, qu'il s'agisse d'assistants basés sur des modèles de langage à grande échelle (LLM), d'agents autonomes ou de fonctionnalités d'apprentissage automatique. Or, les systèmes basés sur l'IA ne se comportent pas comme les logiciels traditionnels. Une même entrée peut produire des résultats différents, la notion de « correct » relève souvent d'un jugement subjectif, et les défaillances peuvent se manifester sous la forme de problèmes de qualité subtils, de biais ou d'« hallucinations », plutôt que par des pannes manifestes. De nombreuses équipes constatent que leurs pratiques de test, leurs indicateurs de performance et leurs critères de validation existants ne leur apportent plus la confiance nécessaire pour livrer leurs produits. Pour la direction, cela se traduit par un risque commercial réel : atteinte à la réputation, risques liés à la conformité et allongement des délais de mise sur le marché.

      L'IA offre également une voie à suivre. Bien utilisée, elle peut automatiser une grande partie du travail qui rend l'assurance qualité lente et coûteuse : générer des scénarios de test et des données réalistes, évaluer à grande échelle des résultats ouverts, analyser en continu les systèmes à la recherche de faiblesses et aider les équipes à identifier plus rapidement les causes profondes des défaillances. Il en résulte une couverture plus large, un retour d'information plus rapide et une réduction des coûts d'assurance qualité, tant pour les systèmes basés sur l'IA que pour les logiciels classiques.

      Cette conférence offre un regard lucide sur les deux aspects de la question. Pour les dirigeants, elle met en lumière les nouveaux risques liés à la qualité qu’introduit l’IA et ce qu’il faut pour les gérer, notamment en précisant dans quels domaines l’investissement est rentable et où la supervision humaine reste indispensable. Pour les professionnels, elle présente des techniques concrètes et des modèles d’outils permettant de tester les systèmes basés sur l’IA et d’utiliser cette dernière pour renforcer les processus d’assurance qualité existants, tout en soulignant les écueils à éviter, tels que la confiance excessive accordée aux évaluateurs d’IA.
    en: |-
      Organizations are racing to embed AI into their products, from LLM-powered assistants to autonomous agents and machine learning features. But AI-based systems don't behave like traditional software. The same input can produce different outputs, "correct" is often a matter of judgment, and failures can surface as subtle quality problems, bias, or hallucinations rather than obvious crashes. Many teams find that their existing testing practices, metrics, and release gates no longer give them the confidence they need to ship. For leadership, this translates into real business risk: reputational damage, compliance exposure, and slower time to market.

      AI also offers a way forward. Used well, it can automate much of the work that makes quality assurance slow and expensive: generating realistic test scenarios and data, evaluating open-ended outputs at scale, continuously probing systems for weaknesses, and helping teams pinpoint the root causes of failures faster. The result can be broader coverage, faster feedback, and lower QA costs, for AI-based systems and conventional software alike.

      This talk offers a clear-eyed look at both sides. For executives, it frames the new quality risks AI introduces and what it takes to manage them, including where investment pays off and where human oversight remains essential. For practitioners, it presents concrete techniques and tooling patterns for testing AI-based systems and for using AI to strengthen existing QA workflows, along with the pitfalls to avoid, such as over-trusting AI evaluators.
  bio:
    fr: "Lionel C. Briand est professeur de génie logiciel et occupe des postes partagés à (1) l'Université d'Ottawa, Canada, et (2) au Lero Centre, le centre Research Ireland pour la recherche sur les logiciels, hébergé par l'Université de Limerick. Il est titulaire d'une chaire de recherche distinguée (systèmes logiciels fiables basés sur l'IA) et dirige Lero. Lionel Briand a été élevé aux rangs de IEEE Fellow et ACM Fellow pour ses contributions aux tests et à la vérification de logiciels. Il a reçu le prix Harlan Mills de l'IEEE Computer Society, le prix de recherche exceptionnelle ACM SIGSOFT et le prix de l'ingénieur de l'année de l'IEEE Reliability Society. De plus, il a reçu une ERC Advanced Grant en 2016 pour la modélisation et le test de systèmes cyber-physiques – le prix de recherche individuel le plus prestigieux de l'Union européenne – et a été élu membre de l'Académie des sciences de la Société royale du Canada en 2023, de l'Academia Europaea --- l'Académie européenne des sciences, en 2025, et de la première ACM SIGSOFT Software Engineering Academy en 2026."
    en: " Lionel C. Briand is a professor of software engineering and holds shared appointments at (1) The University of Ottawa, Canada, and (2) The Lero Centre—the Research Ireland center for software research—hosted by the University of Limerick. He holds a Distinguished Research Chair (Trustworthy AI-enabled Software Systems) and directs Lero. Lionel Briand was elevated to the ranks of IEEE Fellow and ACM Fellow for his contributions to software testing and verification. He received the IEEE Computer Society Harlan Mills Award, the ACM SIGSOFT Outstanding Research Award, and the IEEE Reliability Society Engineer of the Year Award. Additionally, he was awarded an ERC Advanced Grant in 2016 for modeling and testing cyber-physical systems—the most prestigious individual research award in the European Union—and was elected a fellow of the Academy of Science, Royal Society of Canada, in 2023, Academia Europaea---the European Academy of Science, in 2025, and the inaugural ACM SIGSOFT Software Engineering Academy in 2026. "


