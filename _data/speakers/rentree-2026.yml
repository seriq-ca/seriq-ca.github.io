#
# Speaker prose is content, not interface, so it lives here with `fr:`/`en:`
# subkeys rather than in _data/i18n/*.yml, which is for UI strings only.
#
# `title`, `abstract` and `bio` are optional and may be left empty: the card
# renders whatever is set and stays a name-and-affiliation card until the rest
# arrives. An empty string and an absent key behave the same, so the keys can
# sit here as a form to fill in. Order is the order of the programme once slots
# are assigned; for now it is confirmation order.
#
# `keynote: true` tags a speaker as the keynote on the card. The label itself is
# interface text, so it lives under `events.keynote` in _data/i18n/*.yml rather
# than here.
#
# `photo` is either a filename in assets/img/speakers/, which is self-hosted and
# is what the rest of the site does, or an absolute URL, which hotlinks the
# speaker's own copy. See the README in that directory for the trade-off.

- name: Daniel Lemire
  # Free text rather than a key into `institutions:` in _data/i18n/*.yml: that
  # table covers the four partner institutions, and speakers come from
  # elsewhere in Quebec, abroad and from industry. Add `fr:`/`en:` subkeys here
  # if a speaker's affiliation is actually named differently per language.
  affiliation: Université TÉLUQ
  url: https://lemire.me/en/
  # Hotlinked from the speaker's own site rather than self-hosted.
  photo: https://lemire.me/img/portrait2018.jpg
  # Expected to be the keynote, not yet confirmed.
  keynote: false
  title:
    fr: "Le logiciel libre comme méthode de recherche : de l'article scientifique à des milliards d'appareils"
    en: "Open source as a research method: from the scientific paper to billions of devices"
  abstract:
    fr: "Les bibliothèques libres comme simdjson et simdutf s’exécutent aujourd’hui dans Node.js, les navigateurs et les bases de données, au service de milliards de personnes chaque jour. Le modèle linéaire de l’innovation — le professeur publie, l’ingénieur lit, le client consomme — décrit rarement ce qui se passe vraiment. Comme le rappelait Michael Stonebraker, les idées naissent surtout du contact avec des utilisateurs réels et de leurs problèmes concrets. Le logiciel libre n’est pas seulement un moyen de diffuser des résultats : c’est une méthode de recherche à part entière. Il impose la reproductibilité, puisque le code et les bancs d’essai sont publics et vérifiables par quiconque. Les revues de code, les rapports de bogues et les demandes d’intégration forment une évaluation par les pairs souvent plus exigeante que bien des comités de lecture. Il fait aussi arriver les données du monde réel : cas adversariaux, architectures exotiques et charges de travail imprévues. L’histoire de simdjson inverse l’ordre attendu : d’abord le code, un billet de blogue, GitHub et quelques messages sur X, puis l’adoption industrielle, et seulement ensuite l’article scientifique. Le cycle se répète : l’usage révèle le goulot suivant, d’où l’algorithme Eisel-Lemire pour les flottants et simdutf pour l’UTF-8. Cette approche a toutefois ses tensions : la maintenance est ingrate et sans fin, et les incitatifs académiques comptent les articles, pas les contributions concrètes."
    en: "Open-source libraries such as simdjson and simdutf now run in Node.js, in browsers and in databases, serving billions of people every day. The linear model of innovation — the professor publishes, the engineer reads, the customer consumes — rarely describes what actually happens. As Michael Stonebraker pointed out, ideas come mostly from contact with real users and their concrete problems. Open source is not merely a way to disseminate results: it is a research method in its own right. It enforces reproducibility, since the code and the benchmarks are public and anyone can check them. Code reviews, bug reports and pull requests amount to a peer review that is often more demanding than many review committees. It also brings in real-world data: adversarial cases, exotic architectures and unforeseen workloads. The story of simdjson reverses the expected order: first the code, a blog post, GitHub and a few posts on X, then industrial adoption, and only then the scientific paper. The cycle repeats: use reveals the next bottleneck, hence the Eisel-Lemire algorithm for floating-point numbers and simdutf for UTF-8. The approach has its tensions, however: maintenance is thankless and never-ending, and academic incentives count papers, not concrete contributions."
  bio:
    fr: "Daniel Lemire est professeur d'informatique à l'Université du Québec (TELUQ). Ses travaux de
recherche et d'ingénierie portent sur le calcul haute performance, les structures de données
efficaces et l'optimisation de la performance logicielle. Il est l'auteur de bibliothèques libres
largement adoptées : on trouve ses algorithmes et son code dans plusieurs bibliothèques standards et systèmes majeurs, dont .NET, Rust, Go, Node.js, Google Chrome et Safari. Il figure parmi les 2 % de scientifiques les plus cités au monde selon le classement Université Stanford / Elsevier. Il est rédacteur de la revue Software: Practice and Experience (Wiley, fondée en 1971) et a reçu le Prix d'excellence en recherche 2020 de l'Université du Québec pour ses travaux sur l'accélération du traitement des documents JSON. Sur GitHub, il fait partie des 1000 développeurs les plus suivis parmi plus de 100 millions. Il est @lemire sur X et tient un blogue hebdomadaire à l'adresse https://lemire.me/."
    en: "Daniel Lemire is a professor of computer science at the Université du Québec (TÉLUQ). His research and engineering work covers high-performance computing, efficient data structures and software performance optimization. He is the author of widely adopted open-source libraries: his algorithms and his code are found in several standard libraries and major systems, including .NET, Rust, Go, Node.js, Google Chrome and Safari. He is among the top 2 % of most-cited scientists worldwide according to the Stanford University / Elsevier ranking. He is an editor of the journal Software: Practice and Experience (Wiley, founded in 1971) and received the Université du Québec's 2020 Research Excellence Award for his work on accelerating JSON document processing. On GitHub, he is among the 1000 most-followed developers out of more than 100 million. He is @lemire on X and writes a weekly blog at https://lemire.me/."

- name: Lionel Briand
  # Free text rather than a key into `institutions:` in _data/i18n/*.yml: that
  # table covers the four partner institutions, and speakers come from
  # elsewhere in Quebec, abroad and from industry. Add `fr:`/`en:` subkeys here
  # if a speaker's affiliation is actually named differently per language.
  affiliation: University of Ottawa
  url: https://www.lbriand.info/
  # Hotlinked from the speaker's own site rather than self-hosted.
  photo: https://conf.researchr.org/getProfileImage/lionelbriand/c9f095ec-44f6-413a-ac36-62c47cbaa92e/small?1783971207000
  # Expected to be the keynote, not yet confirmed.
  keynote: false
  title:
    fr: "IA Agentique pour le Génie Logiciel: Opportunités, Risques et Questions Ouvertes"
    en: "Agentic AI in Software Engineering: Opportunities, Risks, and Open Questions"
  abstract:
    fr: " Les systèmes d'IA agentique remodèlent la façon dont les logiciels sont conçus, écrits, testés et maintenus. En déléguant des tâches de plus en plus complexes à des agents autonomes et semi-autonomes, les équipes de développement peuvent compresser les cycles de livraison, étendre la couverture des tests et se décharger des tâches de maintenance de routine qui consomment depuis longtemps les capacités d'ingénierie. Les gains potentiels en termes de rapidité et de qualité sont substantiels. Ces gains s’accompagnent de risques et de coûts réels. Le code généré par les agents soulève des questions d'exactitude, de sécurité, de maintenabilité et de responsabilité que les pratiques d'examen et de vérification existantes n'ont pas été conçues pour résoudre. Ce changement bouleverse également les structures d'équipe établies : à mesure que les agents assument des tâches autrefois réparties entre ingénieurs juniors et seniors, les rôles de développeur, de réviseur et d'architecte sont redéfinis, ainsi que la manière dont l'expertise est construite et transférée au sein d'une organisation. Cet exposé passe en revue l'état actuel de l'art en matière de développement de logiciels agents, examine les défis techniques et organisationnels non résolus et décrit les orientations prometteuses pour la recherche et la pratique futures. "
    en: " Agentic AI systems are reshaping how software is designed, written, tested, and maintained. By delegating increasingly complex tasks to autonomous and semi-autonomous agents, development teams can compress delivery cycles, expand test coverage, and offload routine maintenance work that has long consumed engineering capacity. The potential gains in both speed and quality are substantial. These gains come with real risks and costs. Agent-generated code raises questions of correctness, security, maintainability, and accountability that existing review and verification practices were not designed to handle. The shift also disrupts established team structures: as agents absorb tasks once distributed across junior and senior engineers, the roles of developer, reviewer, and architect are being redefined, along with how expertise is built and transferred within an organization. This talk surveys the current state of the art in agentic software development, examines unresolved technical and organizational challenges, and outlines promising directions for future research and practice."
  bio:
    fr: "Lionel C. Briand est professeur de génie logiciel et occupe des postes partagés à (1) l'Université d'Ottawa, Canada, et (2) au Lero Centre, le centre Research Ireland pour la recherche sur les logiciels, hébergé par l'Université de Limerick. Il est titulaire d'une chaire de recherche distinguée (systèmes logiciels fiables basés sur l'IA) et dirige Lero. Lionel Briand a été élevé aux rangs de IEEE Fellow et ACM Fellow pour ses contributions aux tests et à la vérification de logiciels. Il a reçu le prix Harlan Mills de l'IEEE Computer Society, le prix de recherche exceptionnelle ACM SIGSOFT et le prix de l'ingénieur de l'année de l'IEEE Reliability Society. De plus, il a reçu une ERC Advanced Grant en 2016 pour la modélisation et le test de systèmes cyber-physiques – le prix de recherche individuel le plus prestigieux de l'Union européenne – et a été élu membre de l'Académie des sciences de la Société royale du Canada en 2023, de l'Academia Europaea --- l'Académie européenne des sciences, en 2025, et de la première ACM SIGSOFT Software Engineering Academy en 2026."
    en: " Lionel C. Briand is a professor of software engineering and holds shared appointments at (1) The University of Ottawa, Canada, and (2) The Lero Centre—the Research Ireland center for software research—hosted by the University of Limerick. He holds a Distinguished Research Chair (Trustworthy AI-enabled Software Systems) and directs Lero. Lionel Briand was elevated to the ranks of IEEE Fellow and ACM Fellow for his contributions to software testing and verification. He received the IEEE Computer Society Harlan Mills Award, the ACM SIGSOFT Outstanding Research Award, and the IEEE Reliability Society Engineer of the Year Award. Additionally, he was awarded an ERC Advanced Grant in 2016 for modeling and testing cyber-physical systems—the most prestigious individual research award in the European Union—and was elected a fellow of the Academy of Science, Royal Society of Canada, in 2023, Academia Europaea---the European Academy of Science, in 2025, and the inaugural ACM SIGSOFT Software Engineering Academy in 2026. "


